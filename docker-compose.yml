services:
  moha:
    build:
      context: .
      dockerfile: Dockerfile
    image: moha:latest
    container_name: moha
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
    networks:
      - undangan-andri_default

networks:
  undangan-andri_default:
    external: true
